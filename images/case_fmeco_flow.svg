<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Formality ECO validation flow diagram" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif"><title>Formality ECO validation flow diagram</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6670"/></marker></defs><rect width="1000" height="540" fill="#f7f9fb"/><text x="20" y="40" font-size="22" font-weight="700" fill="#212931" text-anchor="start">Validating a Formality ECO nightly build</text>
<text x="20" y="78" font-size="15" font-weight="600" fill="#5b6670" text-anchor="start">Flow for each design · same Fusion Compiler version, different FMECO version</text>
<rect x="20" y="95" width="140" height="66" rx="8" fill="#e3f6fd" stroke="#18bfef" stroke-width="1.5"/>
<text x="90.0" y="123.2" text-anchor="middle" font-size="15" font-weight="700" fill="#212931">FMECO</text>
<text x="90.0" y="143.2" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6670">pre-synthesis</text>
