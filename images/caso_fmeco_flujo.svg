<text x="754.0" y="143.2" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6670">(FC)</text>
<line x1="660" y1="128" x2="681" y2="128" stroke="#5b6670" stroke-width="2" marker-end="url(#a)"/>
<rect x="850" y="95" width="140" height="66" rx="8" fill="#eef1f4" stroke="#c9d1d8" stroke-width="1.5"/>
<text x="920.0" y="123.2" text-anchor="middle" font-size="15" font-weight="700" fill="#212931">FEV final</text>
<text x="920.0" y="143.2" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6670">equivalencia</text>
