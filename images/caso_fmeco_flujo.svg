<text x="623.5" y="260.2" text-anchor="middle" font-size="15" font-weight="700" fill="#212931">Dashboard HTML</text>
<text x="623.5" y="280.2" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6670">por corrida + índice</text>
<line x1="485" y1="265" x2="513" y2="265" stroke="#5b6670" stroke-width="2" marker-end="url(#a)"/>
<rect x="764" y="232" width="215" height="66" rx="8" fill="#ffffff" stroke="#18bfef" stroke-width="1.5"/>
<text x="871.5" y="260.2" text-anchor="middle" font-size="15" font-weight="700" fill="#212931">Checkpoints</text>
<text x="871.5" y="280.2" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6670">de calidad</text>
<line x1="733" y1="265" x2="761" y2="265" stroke="#5b6670" stroke-width="2" marker-end="url(#a)"/>
<path d="M871.5,298 L871.5,328 L170.0,328 L170.0,372" fill="none" stroke="#5b6670" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="375" width="300" height="66" rx="8" fill="#e6f6ec" stroke="#3aa66a" stroke-width="1.5"/>
<text x="170.0" y="403.2" text-anchor="middle" font-size="15" font-weight="700" fill="#212931">Pasa todos</text>
<text x="170.0" y="423.2" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6670">→ nightly aprobado</text>
<path d="M871.5,298 L871.5,328 L500.0,328 L500.0,372" fill="none" stroke="#5b6670" stroke-width="2" marker-end="url(#a)"/>
<rect x="350" y="375" width="300" height="66" rx="8" fill="#fff1e6" stroke="#e8590c" stroke-width="1.5"/>
<text x="500.0" y="403.2" text-anchor="middle" font-size="15" font-weight="700" fill="#212931">Falla real</text>
<text x="500.0" y="423.2" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6670">→ causa raíz y ticket a I+D</text>
<path d="M871.5,298 L871.5,328 L830.0,328 L830.0,372" fill="none" stroke="#5b6670" stroke-width="2" marker-end="url(#a)"/>
<rect x="680" y="375" width="300" height="66" rx="8" fill="#e3f6fd" stroke="#18bfef" stroke-width="1.5"/>
<text x="830.0" y="403.2" text-anchor="middle" font-size="15" font-weight="700" fill="#212931">Falla de máquina o disco</text>
<text x="830.0" y="423.2" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6670">→ agente de IA verifica y re-corre</text>
<line x1="20" y1="482" x2="980" y2="482" stroke="#d5dbe0"/>
<text x="20" y="515" font-size="17" font-weight="700" fill="#212931" text-anchor="start">Resultado: la revisión de cada ciclo pasó de un día de trabajo manual a minutos.</text></svg>
