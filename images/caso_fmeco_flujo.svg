<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Diagrama del flujo de validación de Formality ECO" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif"><title>Diagrama del flujo de validación de Formality ECO</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6670"/></marker></defs><rect width="1000" height="540" fill="#f7f9fb"/><text x="20" y="40" font-size="22" font-weight="700" fill="#212931" text-anchor="start">Validación de un nightly build de Formality ECO</text>
<text x="20" y="78" font-size="15" font-weight="600" fill="#5b6670" text-anchor="start">Flujo de cada diseño · misma versión de Fusion Compiler, distinta versión de FMECO</text>
