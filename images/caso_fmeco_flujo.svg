<text x="20" y="215" font-size="15" font-weight="600" fill="#5b6670" text-anchor="start">Pipeline automático · cada nightly, en la granja HPC con LSF</text>
<rect x="20" y="232" width="215" height="66" rx="8" fill="#ffffff" stroke="#c9d1d8" stroke-width="1.5"/>
<text x="127.5" y="260.2" text-anchor="middle" font-size="15" font-weight="700" fill="#212931">Logs</text>
<text x="127.5" y="280.2" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6670">cientos de corridas</text>
