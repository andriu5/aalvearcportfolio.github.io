<text x="375.5" y="260.2" text-anchor="middle" font-size="15" font-weight="700" fill="#212931">ETL en Python 3</text>
<text x="375.5" y="280.2" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6670">extraer y transformar</text>
