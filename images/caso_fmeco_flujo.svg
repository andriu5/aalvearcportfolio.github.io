<text x="256.0" y="123.2" text-anchor="middle" font-size="15" font-weight="700" fill="#212931">Targeted</text>
<text x="256.0" y="143.2" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6670">Synthesis (FC)</text>
