<rect x="352" y="95" width="140" height="66" rx="8" fill="#e3f6fd" stroke="#18bfef" stroke-width="1.5"/>
<text x="422.0" y="123.2" text-anchor="middle" font-size="15" font-weight="700" fill="#212931">FMECO</text>
<text x="422.0" y="143.2" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6670">post-síntesis</text>
<line x1="328" y1="128" x2="349" y2="128" stroke="#5b6670" stroke-width="2" marker-end="url(#a)"/>
